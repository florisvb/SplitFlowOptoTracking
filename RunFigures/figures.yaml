# Final SVG for each manuscript figure.
#
#   name:   file name used in FinalFigures/{svgs,pdfs,pngs}/ (no extension)
#   script: RunFigures/ script that regenerates the figure
#   svg:    path to the finished SVG, relative to the repository root
#
# collect_final_figures.sh reads this file. To renumber the supplemental
# figures, edit their `name` (e.g. Figure_S3).
#
# Where a figure's notebooks write somewhere other than `svg`, the path they
# write is given in a comment ("notebook writes: ..."). Those figures currently
# point at the committed copy in output_figs/.

main:
  - id: fig1
    name: Figure_1
    title: Unifying-algorithm math
    script: fig1.sh
    svg: FigureGeneration/Main/fig_1_math_figure/unifying_math_v4.svg

  - id: fig2
    name: Figure_2
    title: Wind tunnel and CFD
    script: fig2.sh
    # regenerated by fig2.sh from fig2_template.svg (published copy: output_figs/fig2_tunnel_methods.svg)
    svg: FigureGeneration/Main/fig_2_wind_tunnel_CFD/fig2_tunnel_methods.svg

  - id: fig3
    name: Figure_3
    title: Trajectory characteristics
    script: fig3.sh
    # notebook writes: FigureGeneration/Main/fig_3_trajectory_characteristics/f3_raw_data1.svg
    svg: FigureGeneration/Main/fig_3_trajectory_characteristics/output_figs/f3_raw_data.svg

  - id: fig4
    name: Figure_4
    title: Autoencoder
    script: fig4.sh
    # notebook writes: FigureGeneration/Main/fig_4_autoencoder/test.svg
    svg: FigureGeneration/Main/fig_4_autoencoder/output_figs/f4_autoencoder.svg

  - id: fig5
    name: Figure_5
    title: Unifying-algorithm analysis
    script: fig5.sh
    svg: FigureGeneration/Main/fig_5_unifying_algo_analysis/generate_figure_5/unifying_analysis_translationTrue.svg

supplemental:
  - id: supp_tunnel_methods
    name: Supp_tunnel_methods
